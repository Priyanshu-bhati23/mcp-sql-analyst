[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sql-analyst"
version = "0.1.0"
description = "MCP server giving an LLM safe, read-only SQL access to a SQLite database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.0", "sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
mcp-sql-analyst = "sql_analyst.__main__:main"

[tool.setuptools.packages.find]
include = ["sql_analyst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
